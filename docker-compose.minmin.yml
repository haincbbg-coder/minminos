# MinMin OS - new VPS installation
# Guide: https://github.com/haincbbg-coder/minminos/blob/main/DEPLOY.md
services:
  minmin:
    image: ghcr.io/haincbbg-coder/minminos:latest
    container_name: ${MINMIN_NAME:-minminos}
    restart: unless-stopped
    pull_policy: always
    environment:
      JAVIS_ADMIN_USER: ${MINMIN_ADMIN_USER:-admin}
      JAVIS_ADMIN_PASSWORD: ${MINMIN_ADMIN_PASSWORD:?Set MINMIN_ADMIN_PASSWORD in .env}
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-minmin-update}
      DOMAIN_NAME: ${DOMAIN_NAME:-}
      GHCR_USER: ${GHCR_USER:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    ports:
      - "${MINMIN_BIND:-0.0.0.0}:${MINMIN_HOST_PORT:-7777}:7777"
    volumes:
      - minmin-data:/data
      - minmin-brains:/brains
      - claude-auth:/home/javis/.claude
      - codex-auth:/home/javis/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1
    container_name: ${MINMIN_NAME:-minminos}-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:-minmin-update}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: ${MINMIN_AUTO_UPDATE:-false}
      WATCHTOWER_POLL_INTERVAL: 86400
      WATCHTOWER_CLEANUP: "true"
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_TOKEN:-}
    command: ${MINMIN_NAME:-minminos}
volumes:
  minmin-data:
  minmin-brains:
  claude-auth:
  codex-auth:
