name: Build & Publish Docker image (GHCR)

# Mỗi lần push lên main → build image Docker và đẩy lên GitHub Container Registry
# (ghcr.io/blogminhquy/javis-os). Hostinger Docker Manager / VPS chỉ cần PULL image này.
on:
  push:
    branches: [main]
    # Chỉ bỏ qua build khi push THUẦN tài liệu (không ảnh hưởng image).
    # CLAUDE.md là system prompt nạp vào image → KHÔNG ignore, để sửa nó là build lại.
    paths-ignore:
      - "README.md"
      - "DEPLOY.md"
      - ".learn/**"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Read app version
        run: echo "APP_VERSION=$(cat VERSION | tr -d ' \n\r')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve current Codex CLI version
        shell: bash
        run: |
          # Bản `latest` có thể đã khai trên npm nhưng gói nhị phân linux chưa tải được (gặp
          # thật 2026-10-23: 0.164.0 khai `@openai/codex@0.164.0-linux-x64` mà tarball 404,
          # `npm install -g` cài xong lõi rồi `codex --version` nổ, phát hành 26.10.208 đỏ hai
          # lần). Nên lùi dần về bản gần nhất mà tarball linux-x64 THỰC SỰ tải được.
          version=""
          for v in $(npm view @openai/codex versions --json | python3 -c "import json,sys;v=[x for x in json.load(sys.stdin) if x.count('.')==2 and '-' not in x];print(' '.join(reversed(v[-8:])))"); do
            tb="$(npm view "@openai/codex@${v}-linux-x64" dist.tarball 2>/dev/null || true)"
            if [ -n "$tb" ] && curl -sfIL "$tb" >/dev/null; then version="$v"; break; fi
            echo "Bỏ qua Codex $v: gói linux-x64 chưa tải được"
          done
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Codex version: $version"; exit 1; }
          echo "CODEX_CLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "Codex CLI: $version" >> "$GITHUB_STEP_SUMMARY"

      # Cùng lý do với Codex ở trên: `@latest` trong Dockerfile là chuỗi KHÔNG đổi, nên cache
      # gha giữ nguyên lớp npm cũ mãi và ảnh mới vẫn mang Claude Code cũ. Model mới (Sonnet 5.5)
      # vì thế không bao giờ tới VPS. Truyền số phiên bản thật thì lớp đổi khi có bản mới.
      - name: Resolve current Claude Code version
        shell: bash
        run: |
          version="$(npm view @anthropic-ai/claude-code@latest version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Claude Code version: $version"; exit 1; }
          echo "CLAUDE_CLI_VERSION=$version" >> "$GITHUB_ENV"
          echo "Claude Code: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CODEX_CLI_VERSION=${{ env.CODEX_CLI_VERSION }}
            CLAUDE_CLI_VERSION=${{ env.CLAUDE_CLI_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
